name: Deploy isolated English Hero preview
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!README.md'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-preview
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated preview
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload isolated student-site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
